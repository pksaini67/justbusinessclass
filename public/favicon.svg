<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Dark Gold Luxury Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E170E"/>
      <stop offset="100%" stop-color="#0A0805"/>
    </radialGradient>
    
    <!-- Shimmer Gold Gradient for Wings & Jet -->
    <linearGradient id="jetGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DC"/>
      <stop offset="35%" stop-color="#E8D2A4"/>
      <stop offset="70%" stop-color="#D4B877"/>
      <stop offset="100%" stop-color="#9B7838"/>
    </linearGradient>

    <!-- Silver Platinum Border Gradient -->
    <linearGradient id="silverRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#D4B877" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#718096" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4B877" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base with Gold/Silver Rim -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGlow)" stroke="url(#silverRim)" stroke-width="2"/>

  <!-- Inner Subtle Accent Ring -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="none" stroke="#D4B877" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Flight Contrails / Curved Airflow in Silver & Gold -->
  <path d="M14 46 C22 41, 26 39, 32 39 C38 39, 42 41, 50 46" stroke="url(#jetGold)" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M19 50 C25 46, 28 44, 32 44 C36 44, 39 46, 45 50" stroke="#E2E8F0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Supersonic Flight Airplane Silhouette -->
  <g filter="url(#goldGlow)">
    <!-- Main Fuselage and Swept Wings -->
    <path d="M32 10 L37.5 26 L52 32 L38 36.5 L32 53 L26 36.5 L12 32 L26.5 26 Z" fill="url(#jetGold)"/>
    <!-- Fuselage Core Line / Cockpit Highlight -->
    <path d="M32 13 L33.5 28 L32 47 L30.5 28 Z" fill="#FFFFFF" opacity="0.85"/>
    <!-- Central Jewel / Star -->
    <circle cx="32" cy="32" r="2.2" fill="#FFFFFF"/>
  </g>
</svg>
