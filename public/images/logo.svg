<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 76" fill="none" class="h-10 sm:h-12 w-auto">
  <defs>
    <!-- Rich Golden Gradient -->
    <linearGradient id="jbcGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D2A4" />
      <stop offset="35%" stop-color="#C6A667" />
      <stop offset="70%" stop-color="#B8934F" />
      <stop offset="100%" stop-color="#8F6B28" />
    </linearGradient>

    <!-- Silver Platinum Gradient -->
    <linearGradient id="jbcSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>

    <!-- Emblem Glow -->
    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C6A667" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Emblem Icon: Crown Wings + Supersonic Jet Monogram -->
  <g transform="translate(4, 6)" filter="url(#emblemGlow)">
    <!-- Base Rounded Diamond Crest -->
    <rect x="2" y="2" width="60" height="60" rx="16" fill="#FFFFFF" stroke="url(#jbcGold)" stroke-width="1.8" />
    <rect x="6" y="6" width="52" height="52" rx="12" fill="#FBFBFB" stroke="url(#jbcSilver)" stroke-width="0.8" />

    <!-- Supersonic Aviation Silhouette -->
    <path d="M32 14 L37 28 L49 32 L37 36 L32 50 L27 36 L15 32 L27 28 Z" fill="url(#jbcGold)" />
    <!-- Wing Contrails in Silver -->
    <path d="M20 44 C24 40, 27 38, 32 38 C37 38, 40 40, 44 44" stroke="url(#jbcGold)" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <circle cx="32" cy="32" r="3" fill="#FFFFFF" />
  </g>

  <!-- Text Wordmark -->
  <!-- "JustBusiness" in crisp editorial dark navy/charcoal -->
  <text x="82" y="38" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="30" font-weight="700" fill="#0F172A" letter-spacing="-0.5">
    Just<tspan fill="#1E293B">Business</tspan><tspan fill="url(#jbcGold)">Class</tspan>
  </text>

  <!-- Domain ".us" Tag Pill in Champagne Gold -->
  <g transform="translate(378, 18)">
    <rect x="0" y="0" width="38" height="20" rx="6" fill="#FBF6EC" stroke="url(#jbcGold)" stroke-width="1" />
    <text x="19" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#9B7838" text-anchor="middle" letter-spacing="0.5">.us</text>
  </g>

  <!-- Sub-wordmark Subtitle -->
  <text x="83" y="55" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#9CA3AF" letter-spacing="3.2">
    PREMIUM CONCIERGE FLIGHTS · USA
  </text>
</svg>
