<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="grad-lufthansa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05164D" />
      <stop offset="100%" stop-color="#FFAC00" />
    </linearGradient>
  </defs>
  <!-- Carrier Emblem / Monogram Icon -->
