  <text x="44" y="58" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="28" font-weight="900" letter-spacing="1">LH</text>
  
  <!-- Airline Logotype -->
  <text x="96" y="50" fill="#0F172A" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="30" font-weight="800" letter-spacing="0.5">Lufthansa</text>
  <text x="98" y="72" fill="#64748B" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" text-transform="uppercase">German Airlines</text>
